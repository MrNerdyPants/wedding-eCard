      </div>

      <div class="env-back" aria-hidden="true"></div>

      <!-- the cards, sitting inside it -->
      <div class="bundle" id="bundle"></div>

      <!-- the pocket: the side and bottom flaps, folded up from the
           back. Everything inside the envelope hides behind this. -->
      <div class="env-front" aria-hidden="true">
        <svg class="env-folds" viewBox="0 0 100 100" preserveAspectRatio="none">

          <span class="env-addr-label">For</span>
          <span class="env-addr-name" id="envAddrName"></span>
          <span class="env-addr-rule"></span>
        </div>
      </div>

      <!-- the flap, hinged along the top edge -->
      <div class="env-flap"><i aria-hidden="true"></i>
      <button class="seal-btn" id="sealBtn" aria-label="Open your invitation">

              <stop offset="100%" stop-color="#4D6656"/>

            <g id="sealBody">
              <circle cx="110" cy="112" r="86" fill="url(#waxG)" filter="url(#waxRough)"/>
              <circle cx="110" cy="112" r="69" fill="none" stroke="#F1F6EF" stroke-opacity=".26" stroke-width="1.4"/>
              <circle cx="110" cy="112" r="64" fill="none" stroke="#3B5244" stroke-opacity=".20" stroke-width="1"/>
              <path d="M92 84 h36" stroke="#F1F6EF" stroke-opacity=".30" stroke-width="1"/>
              <text x="110" y="123" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif"

                    fill="#33473A" fill-opacity=".5" class="seal-mono">J &amp; J</text>
              <text x="110" y="121.5" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif"
                    font-weight="600" font-size="36" letter-spacing="1.5"
                    fill="#F6FAF4" fill-opacity=".93" class="seal-mono">J &amp; J</text>
              <path d="M92 136 h36" stroke="#F1F6EF" stroke-opacity=".30" stroke-width="1"/>
              <text class="seal-year" x="110" y="152" text-anchor="middle" font-family="'Jost',system-ui,sans-serif"
                    font-size="10" letter-spacing="2.6"
                    fill="#F6FAF4" fill-opacity=".8">2027</text>
            </g>

          </defs>

          <g class="wax"><use href="#sealBody"/></g>
        </svg>
      </button>
      </div>


      <!-- the shadow the wax leaves on the paper as it lifts away -->

    </div>

    <p class="open-hint" id="openHint">Tap the seal to open</p>
